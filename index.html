<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanvyara AI – Smart College Learning Assistant</title>
<style>
  :root { --pri:#17365D; --acc:#7C3AED; --bg:#F8FAFC; --card:#fff; --line:#e3e8f0; --text:#0f1f36; --muted:#5d6b82; --soft:#f1ecfe; --head:#17365D; --ok:#15803d; --err:#dc2626; --shadow:0 4px 18px rgba(23,54,93,.07); }
  :root[data-theme=dark] { --bg:#0b1220; --card:#131d30; --line:#26344e; --text:#e8eef8; --muted:#94a3bd; --soft:#251d47; --head:#cfe0ff; --acc:#8b5cf6; --ok:#4ade80; --err:#f87171; --shadow:none; color-scheme:dark; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  [hidden] { display:none !important; }
  a { color:var(--acc); text-decoration:none; }
  h1,h2,h3 { color:var(--head); line-height:1.2; margin:0; } h2 { font-size:24px; } h3 { font-size:16px; }
  select,input,textarea { width:100%; min-width:0; padding:11px 13px; font:inherit; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--text); }
  input[type=checkbox] { width:auto; } textarea { min-height:130px; resize:vertical; } select:disabled { opacity:.55; }
  input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible { outline:2px solid var(--acc); outline-offset:1px; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .btn { display:inline-flex; justify-content:center; align-items:center; gap:6px; padding:11px 18px; border:1px solid transparent; border-radius:12px; background:var(--acc); color:#fff; font-weight:700; }
  .btn.alt { background:var(--card); color:var(--text); border-color:var(--line); } .btn.sm { padding:6px 11px; font-size:13px; border-radius:9px; } .btn.bad { background:none; color:var(--err); border-color:var(--line); }
  .btn.on { background:var(--soft); color:var(--acc); border-color:var(--acc); } .btn:disabled { opacity:.55; cursor:default; }
  .link { background:none; border:0; padding:0; color:var(--acc); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--shadow); display:grid; gap:10px; align-content:start; min-width:0; }
  .stack { display:grid; grid-template-columns:minmax(0,1fr); gap:14px; align-content:start; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .grid.s { grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); }
  .form { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:9px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; } .between { justify-content:space-between; }
  .muted { color:var(--muted); font-size:13px; } .wrap { overflow-wrap:anywhere; }
  .stat b { font-size:30px; color:var(--acc); line-height:1; }
  .badge { justify-self:start; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:99px; background:var(--soft); color:var(--acc); }
  .badge.ok { color:var(--ok); } .badge.bad { color:var(--err); }
  .ico { width:42px; height:42px; display:grid; place-items:center; border-radius:13px; background:var(--soft); font-size:21px; }
  .item { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); min-width:0; } .item:last-child { border:0; }
  .item > :first-child { min-width:0; overflow-wrap:anywhere; }
  .empty { color:var(--muted); text-align:center; padding:22px 8px; font-size:14px; }
  .foot { text-align:center; font-size:12px; color:var(--muted); padding:22px 10px 10px; } .foot b { color:var(--acc); }
  .logo { display:flex; align-items:center; gap:9px; font-weight:800; font-size:19px; color:var(--head); white-space:nowrap; }
  .logo i { width:34px; height:34px; border-radius:11px; display:grid; place-items:center; font-style:normal; color:#fff; background:linear-gradient(135deg,#17365D,#7C3AED); }
  .msg { padding:10px 14px; border-radius:12px; font-size:14px; background:var(--soft); } .msg.err { color:var(--err); }
  /* landing */
  .top { position:sticky; top:0; z-index:8; background:var(--card); border-bottom:1px solid var(--line); }
  .top > div { max-width:1100px; margin:auto; padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
  .links { display:flex; gap:16px; overflow-x:auto; order:3; width:100%; } .links button { background:none; border:0; padding:2px 0; font-weight:600; color:var(--muted); white-space:nowrap; }
  .land { max-width:1100px; margin:auto; padding:0 16px; }
  .hero { display:grid; gap:28px; padding:44px 0; align-items:center; }
  .hero h1 { font-size:clamp(34px,7vw,56px); letter-spacing:-1.5px; margin-bottom:12px; }
  .mock { background:linear-gradient(145deg,#17365D,#7C3AED); border-radius:28px; padding:22px; display:grid; gap:11px; color:#10203a; }
  .mock div { background:#fff; padding:11px 15px; border-radius:16px; max-width:85%; animation:up .6s both; } .mock div:nth-child(2n) { justify-self:end; background:#e9defd; animation-delay:.25s; } .mock .bot { background:none; color:#fff; font-size:54px; line-height:1; }
  section.band { padding:30px 0; scroll-margin-top:100px; } section.band > h2 { margin-bottom:16px; text-align:center; }
  @media (min-width:800px) { .hero { grid-template-columns:1.1fr .9fr; } .links { order:0; width:auto; } }
  .auth { max-width:420px; margin:30px auto; padding:0 16px; }
  /* app shell */
  .bar { position:sticky; top:0; z-index:8; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; background:var(--card); border-bottom:1px solid var(--line); }
  .side { position:fixed; z-index:10; top:0; bottom:0; left:0; width:250px; padding:14px 12px; background:#17365D; color:#dbe6f8; display:flex; flex-direction:column; gap:3px; overflow-y:auto; transform:translateX(-100%); transition:transform .22s; }
  .side.open { transform:none; box-shadow:0 0 0 100vmax rgba(0,0,0,.45); }
  .side .logo { color:#fff; margin:2px 6px 14px; }
  .side a, .side button.nv { display:flex; gap:11px; align-items:center; padding:10px 12px; border-radius:11px; color:#dbe6f8; font-weight:600; font-size:14px; background:none; border:0; text-align:left; }
  .side a.on, .side a:hover, .side button.nv:hover { background:#7C3AED; color:#fff; }
  main { max-width:1060px; margin:auto; padding:18px 14px; animation:up .25s; } @keyframes up { from { opacity:0; transform:translateY(8px); } }
  @media (min-width:960px) { .side { transform:none; } .side.open { box-shadow:none; } .body { margin-left:250px; } .burger, .bar .logo { display:none; } .bar { justify-content:flex-end; } }
  /* chat */
  .chat { display:grid; gap:14px; grid-template-columns:minmax(0,1fr); }
  .hist { display:none; } .hist.show { display:grid; }
  @media (min-width:1150px) { .chat { grid-template-columns:230px minmax(0,1fr); } .hist { display:grid; position:sticky; top:72px; max-height:calc(100vh - 100px); overflow:auto; } .histbtn { display:none; } }
  .thread { display:grid; grid-template-columns:minmax(0,1fr); gap:14px; }
  .q { justify-self:end; max-width:88%; background:var(--acc); color:#fff; padding:10px 15px; border-radius:18px 18px 4px 18px; overflow-wrap:anywhere; }
  .a { white-space:pre-wrap; overflow-wrap:anywhere; } .sig { font-size:11.5px; color:var(--muted); border-top:1px dashed var(--line); padding-top:7px; }
  .composer { position:sticky; bottom:8px; display:grid; gap:8px; }
  .ask { display:flex; gap:7px; padding:6px; background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 28px rgba(0,0,0,.14); } .ask input { border:0; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:2px; } .chips .btn { flex:none; }
  .dots::after { content:'●●●'; letter-spacing:3px; font-size:11px; color:var(--acc); animation:blink 1s infinite; } @keyframes blink { 50% { opacity:.2; } }
  /* viewer, quiz, charts */
  .viewer { overflow:auto; background:#64748b; border-radius:14px; padding:8px; max-height:75vh; text-align:center; } .viewer canvas { background:#fff; display:block; margin:auto; }
  .viewer:fullscreen { max-height:none; border-radius:0; }
  .doc-text { white-space:pre-wrap; overflow-wrap:anywhere; max-height:360px; overflow:auto; } mark { background:#fde68a; color:#222; }
  .opt { text-align:left; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
  .opt.on { border-color:var(--acc); background:var(--soft); } .opt.right { border-color:var(--ok); } .opt.wrong { border-color:var(--err); }
  .nums button { width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--card); } .nums button.done { background:var(--soft); } .nums button.cur { border:2px solid var(--acc); }
  .bar-row { display:grid; grid-template-columns:minmax(70px,130px) 1fr 40px; gap:9px; align-items:center; font-size:13px; } .bar-row i { height:12px; border-radius:99px; background:linear-gradient(90deg,#17365D,#7C3AED); min-width:3px; }
  .avatar { width:76px; height:76px; border-radius:50%; object-fit:cover; background:var(--soft); display:grid; place-items:center; font-size:30px; font-weight:800; color:var(--acc); }
  #toast { position:fixed; left:50%; top:68px; transform:translateX(-50%); z-index:20; background:#17365D; color:#fff; padding:10px 18px; border-radius:12px; width:max-content; max-width:90vw; font-size:14px; } #toast.err { background:#b91c1c; }
  .book { display:grid; grid-template-columns:minmax(0,1fr); gap:8px; white-space:normal; }
  .book-page { display:block; width:100%; height:auto; background:#fff; border:1px solid var(--line); border-radius:10px; }
  /* ---------- motion ---------- */
  .stack > *, .grid > * { animation:rise .45s cubic-bezier(.2,.8,.3,1) backwards; }
  .stack > :nth-child(2), .grid > :nth-child(2) { animation-delay:.06s; } .stack > :nth-child(3), .grid > :nth-child(3) { animation-delay:.12s; }
  .stack > :nth-child(4), .grid > :nth-child(4) { animation-delay:.18s; } .stack > :nth-child(5), .grid > :nth-child(5) { animation-delay:.24s; } .stack > :nth-child(n+6), .grid > :nth-child(n+6) { animation-delay:.3s; }
  @keyframes rise { from { opacity:0; transform:translateY(18px) scale(.98); } }
  .card { transition:transform .25s, box-shadow .25s, border-color .25s; }
  @media (hover:hover) { .grid > .card:hover { transform:translateY(-5px); box-shadow:0 14px 30px rgba(23,54,93,.16); border-color:var(--acc); } .card:hover > .ico { transform:rotate(-8deg) scale(1.15); } .btn:not(:disabled):hover { transform:translateY(-2px); filter:brightness(1.07); } }
  .ico { transition:transform .3s; }
  .btn { position:relative; overflow:hidden; transition:transform .15s, filter .15s, background .2s; } .btn:not(:disabled):active { transform:scale(.95); }
  .ripple { position:absolute; border-radius:50%; background:currentColor; opacity:.3; pointer-events:none; transform:scale(0); animation:ripple .6s ease-out forwards; } @keyframes ripple { to { transform:scale(2.4); opacity:0; } }
  .side a { transition:background .2s, transform .2s; } .side.open a { animation:slide .35s backwards; animation-delay:calc(var(--i) * 25ms); } .side a:hover { transform:translateX(5px); } @keyframes slide { from { opacity:0; transform:translateX(-25px); } }
  .q { animation:pop .35s cubic-bezier(.2,1.4,.4,1); transform-origin:bottom right; } @keyframes pop { from { opacity:0; transform:scale(.7); } }
  .opt { transition:transform .15s, background .2s, border-color .2s; } .opt.on { animation:bump .3s; } @keyframes bump { 50% { transform:scale(1.03); } }
  button.opt:focus-within > .muted:not([hidden]) { animation:pop .3s; }
  .bar-row i { transform-origin:left; animation:grow .9s cubic-bezier(.2,.8,.3,1) backwards; } @keyframes grow { from { transform:scaleX(0); } }
  .badge.bad { animation:pulse 1.8s infinite; } @keyframes pulse { 50% { opacity:.6; } }
  .dots::after { display:inline-block; animation:blink 1s infinite, hop .8s ease-in-out infinite alternate; } @keyframes hop { to { transform:translateY(-4px); } }
  #toast { animation:drop .35s cubic-bezier(.2,1.4,.4,1); } @keyframes drop { from { opacity:0; margin-top:-20px; } }
  .hero h1 { background:linear-gradient(90deg,var(--head),var(--acc),var(--head)); background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 6s linear infinite; } @keyframes shine { to { background-position:200% center; } }
  .mock { background-size:200% 200%; animation:flow 8s ease infinite alternate; } @keyframes flow { to { background-position:100% 100%; } }
  .mock .bot { animation:float 3s ease-in-out infinite alternate; } @keyframes float { to { transform:translateY(-12px) rotate(6deg); } }
  section.band { transition:opacity .7s, transform .7s; } section.band.hide { opacity:0; transform:translateY(40px); } section.band.hide.seen { opacity:1; transform:none; }
  .logo i { transition:transform .4s; } .logo:hover i { transform:rotate(360deg); }
  .rank.me { background:var(--soft); border-radius:12px; padding-left:10px; padding-right:10px; }
  .swatch { width:46px; height:46px; border-radius:50%; border:4px solid var(--card); box-shadow:0 0 0 1px var(--line); transition:transform .2s; } .swatch.on { box-shadow:0 0 0 3px var(--text); transform:scale(1.12); }
  .confetti { position:fixed; inset:0; pointer-events:none; z-index:30; overflow:hidden; } .confetti i { position:absolute; top:-12px; width:9px; height:15px; animation:fall linear forwards; } @keyframes fall { to { transform:translateY(105vh) rotate(720deg); } }
  .bar .row { flex-wrap:nowrap; min-width:0; } .bar .logo { font-size:17px; }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" hidden></div>
<script>
// ================= helpers =================
function h(tag, attrs, ...kids) {             // strings become text nodes, so user data can't inject HTML
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  el.append(...kids.flat(3).filter(k => k != null && k !== false));
  return el;
}
const FOOTER = 'Design & Developed by Mr. Rohit';
const $app = document.getElementById('app'), $toast = document.getElementById('toast');
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) ?? sessionStorage.getItem(k)); } catch { return null; } },
  set(k, v, keep = true) { try { (keep ? localStorage : sessionStorage).setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch {} },
};
const state = { token: store.get('sv_token'), user: store.get('sv_user'), cache: {}, info: {}, chat: null };
let toastTimer, cleanup = [];
function toast(t, bad) { $toast.textContent = t; $toast.className = bad ? 'err' : ''; $toast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => $toast.hidden = true, 3000); }
async function api(path, method = 'GET', body) {
  const res = await fetch(path, { method, headers: { 'Content-Type': 'application/json', ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  let data = null; try { data = await res.json(); } catch {}
  if (res.status === 401 && state.token) { logout(); throw new Error('Session expired. Please log in again.'); }
  if (!res.ok) throw new Error(typeof data?.detail === 'string' ? data.detail : 'Please check the fields and try again');
  return data;
}
async function safe(fn) { try { return await fn(); } catch (e) { toast(e.message, true); } }
const URLS = { tree: '/api/tree', docs: '/api/documents', items: '/api/items', history: '/api/history', prefs: '/api/prefs', assignments: '/api/assignments', teaching: '/api/teaching', overview: '/api/admin/overview', folder: '/api/admin/settings' };
async function need(...keys) { await Promise.all(keys.map(async k => { state.cache[k] ??= await api(URLS[k]); })); return state.cache; }
const drop = (...keys) => keys.forEach(k => delete state.cache[k]);
const footer = () => h('div', { class: 'foot' }, 'Design & Developed by ', h('b', {}, 'Mr. Rohit'));
const logo = () => h('div', { class: 'logo' }, h('i', {}, 'S'), 'Sanvyara AI');
const go = path => { location.hash = '#/' + path; };
const card = (title, ...kids) => h('div', { class: 'card' }, title ? h('h3', {}, title) : null, kids);
const empty = t => h('div', { class: 'empty' }, t);
const btn = (label, onclick, cls = '') => h('button', { type: 'button', class: 'btn ' + cls, onclick: async e => { const b = e.currentTarget; b.disabled = true; try { await safe(() => onclick(b)); } finally { b.disabled = false; } } }, label);
const select = (label, options, value = '') => { const s = h('select', { 'aria-label': label }, options.map(([v, l]) => h('option', { value: v }, l))); s.value = value; return s; };
const input = (placeholder, attrs = {}) => h('input', { placeholder, 'aria-label': placeholder, ...attrs });
function form(submitLabel, fields, onsubmit, cls = 'card') {
  const b = h('button', { class: 'btn', type: 'submit' }, submitLabel), err = h('div', { class: 'msg err', hidden: true });
  return h('form', { class: cls, onsubmit: async e => {
    e.preventDefault(); b.disabled = true; err.hidden = true;
    try { await onsubmit(b); } catch (x) { err.textContent = x.message; err.hidden = false; } finally { b.disabled = false; }
  } }, fields, err, b);
}
const rich = t => t.split(/\*\*(.+?)\*\*/g).map((p, i) => i % 2 ? h('strong', {}, p) : p);
const clean = t => String(t).split('\n\n— ' + FOOTER)[0];
const answerBlock = text => [h('div', { class: 'a' }, rich(clean(text))), h('div', { class: 'sig' }, '— ' + FOOTER)];
const day = s => s ? new Date(s).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const copy = t => navigator.clipboard.writeText(t).then(() => toast('Copied'), () => toast('Could not copy', true));

// ---- tree helpers ----
const allSemesters = tree => tree.flatMap(c => c.semesters.map(s => ({ ...s, course: c })));
const allSubjects = tree => allSemesters(tree).flatMap(s => s.subjects.map(x => ({ ...x, sem: s, course: s.course })));
const subjectName = id => allSubjects(state.cache.tree || []).find(s => s.subject_id === id)?.subject_name || '';
const items = kind => (state.cache.items || []).filter(i => i.kind === kind);
const profile = () => items('profile')[0]?.data || {};
function mySubjects() { const all = allSubjects(state.cache.tree), p = profile(); const mine = all.filter(s => s.sem.semester_id === p.semester_id); return mine.length ? mine : all; }
const units = sid => [...new Set((state.cache.docs || []).filter(d => d.subject_id === sid && d.unit !== '').map(d => String(d.unit)))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
async function saveItem(kind, ref, data) {
  const r = await api('/api/items', 'POST', { kind, ref, data });
  const single = !['bookmark', 'quiz', 'focus'].includes(kind);
  state.cache.items = [...(state.cache.items || []).filter(i => !(single && i.kind === kind && i.ref === ref)), r];
  return r;
}
async function removeItem(id) { await api('/api/items/' + id, 'DELETE'); state.cache.items = state.cache.items.filter(i => i.item_id !== id); }

// Course > Semester > Subject > (PDF) > (Unit) selectors
function picker(opts = {}) {
  const { levels = 3, value = {}, doc, unit, onChange } = opts;
  const tree = state.cache.tree;
  const sel = ['Course', 'Semester', 'Subject'].slice(0, levels).map(n => h('select', { 'aria-label': n }));
  const dsel = doc ? h('select', { 'aria-label': 'PDF' }) : null, usel = unit ? h('select', { 'aria-label': 'Unit' }) : null;
  const sub = allSubjects(tree).find(s => s.subject_id === value.subject_id);
  const sem = sub?.sem || allSemesters(tree).find(s => s.semester_id === value.semester_id);
  const init = [sem?.course.course_id || value.course_id, sem?.semester_id, sub?.subject_id];
  const set = (s, name, list) => { s.replaceChildren(h('option', { value: '' }, name), ...list.map(([v, l]) => h('option', { value: v }, l))); };
  function fill(i) {
    const c = tree.find(x => x.course_id === sel[0].value), s = c?.semesters.find(x => x.semester_id === sel[1]?.value);
    const list = i === 0 ? tree.map(x => [x.course_id, x.course_name]) : i === 1 ? (c?.semesters || []).map(x => [x.semester_id, x.semester_name]) : (s?.subjects || []).map(x => [x.subject_id, x.subject_name]);
    set(sel[i], ['Course', 'Semester', 'Subject'][i], list); sel[i].disabled = i > 0 && !sel[i - 1].value;
  }
  function extra() {
    const sid = sel[2]?.value;
    if (dsel) { set(dsel, 'All PDFs (optional)', (state.cache.docs || []).filter(d => d.subject_id === sid).map(d => [d.document_id, d.pdf_name])); dsel.disabled = !sid; }
    if (usel) { set(usel, 'All units', units(sid).map(u => [u, 'Unit ' + u])); usel.disabled = !sid; }
  }
  sel.forEach((s, i) => { fill(i); if (init[i]) s.value = init[i]; });
  sel.forEach((s, i) => { if (i) { const v = s.value; fill(i); s.value = v; } });
  extra(); if (dsel && value.document_id) dsel.value = value.document_id;
  const get = () => ({ course_id: sel[0].value, semester_id: sel[1]?.value || '', subject_id: sel[2]?.value || '', document_id: dsel?.value || '', unit: usel?.value || '' });
  [...sel, dsel, usel].forEach((s, i) => s?.addEventListener('change', () => { if (i < levels) { for (let j = i + 1; j < levels; j++) fill(j); extra(); } onChange?.(get()); }));
  return { el: h('div', { class: 'form' }, sel, dsel, usel), get };
}

// ================= public pages =================
const SUBJ_ICON = ['🗄️', '⚙️', '🌐', '☕', '🐍', '📐', '📘', '🧪'];
function landing() {

function authPage(kind) {

  const enter = (r, keep) => { state.token = r.token; state.user = r.user; state.cache = {}; store.set('sv_token', r.token, keep); store.set('sv_user', r.user, keep); };
  if (kind === 'forgot') {
    const code = input('6 digit code', { inputmode: 'numeric', maxlength: 6, autocomplete: 'one-time-code', required: true });
    const next = input('New password', { type: 'password', required: true, minlength: 6, autocomplete: 'new-password' });

        btn('Send code again (after 1 minute)', async () => { toast((await ask()).message); }, 'sm alt')], async () => {
        await api('/api/reset', 'POST', { email: email.value, code: code.value, new: next.value });

    });
    box.append(step1);
    return shell('Forgot Password', box, h('a', { href: '#/login' }, 'Back to login'));
  }
  if (kind === 'login') {
    const remember = h('input', { type: 'checkbox', checked: true });
    return shell('Login', form('Login', [email, pass, h('div', { class: 'row between' }, h('label', { class: 'row' }, remember, 'Remember Me'), h('a', { href: '#/forgot' }, 'Forgot Password?'))],

      ['New here? ', h('a', { href: '#/register' }, 'Create Account')]);
  }
  const name = input('Full Name', { required: true, autocomplete: 'name' }), again = input('Confirm Password', { type: 'password', required: true });
  const holder = h('div', {}, h('div', { class: 'muted' }, 'Loading courses…')); let pick;

  return shell('Create Account', form('Register', [name, email, pass, again, holder], async () => {

// ---------- PDF viewer ----------
let pdfLib;
function loadPdfJs() {
  return pdfLib ||= new Promise((ok, bad) => {
    const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    const s = h('script', { src: base + 'pdf.min.js' });
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; ok(window.pdfjsLib); };
    s.onerror = () => { pdfLib = null; s.remove(); bad(new Error('PDF viewer could not load')); };
    document.head.append(s);
  });
}
async function viewer(id, query) {
  await need('tree', 'docs', 'items', 'prefs');
  const d = state.cache.docs.find(x => x.document_id === id);
  if (!d) return empty('Document not found.');
  saveItem('view', id, {}).catch(() => {});
  const box = h('div', { class: 'viewer' }, h('div', { class: 'dots' })), textBox = h('div'), tools = h('div', { class: 'row' });
  const link = /^https?:\/\//.test(d.drive_link) ? d.drive_link : '';
  const fileId = link.match(/(?:\/d\/|[?&]id=)([\w-]{20,})/)?.[1];
  const q = input('Ask a question about this page', { maxlength: 500 });
  let page = Math.max(1, +query.get('page') || 1), pdf, zoom = 1, passages = [], busy = false, again = false;
  const label = h('span', { class: 'muted' });
  function showText() {
    const mine = passages.filter(t => !t.page || !pdf || t.page === page);
    const hl = query.get('hl') || '';
    textBox.replaceChildren(mine.length ? card(pdf ? 'Text on this page' : 'Document text', h('div', { class: 'doc-text' }, mine.map(t => {
      const at = hl ? t.text.indexOf(hl.slice(0, 60)) : -1;
      return h('p', {}, t.page ? h('b', {}, `Page ${t.page}\n`) : null, at < 0 ? t.text : [t.text.slice(0, at), h('mark', {}, t.text.slice(at, at + hl.length)), t.text.slice(at + hl.length)]);
    }))) : '');
    textBox.querySelector('mark')?.scrollIntoView({ block: 'nearest' });
  }
  async function draw() {
    if (!pdf) return;
    if (busy) { again = true; return; }
    busy = true;
    try {
      const p = await pdf.getPage(page), base = p.getViewport({ scale: 1 });
      const vp = p.getViewport({ scale: Math.max(280, box.clientWidth - 20) / base.width * zoom });
      const ratio = Math.min(2, window.devicePixelRatio || 1);
      const c = h('canvas', { width: Math.floor(vp.width * ratio), height: Math.floor(vp.height * ratio), style: `width:${vp.width}px;height:${vp.height}px` });
      await p.render({ canvasContext: c.getContext('2d'), viewport: vp, transform: [ratio, 0, 0, ratio, 0, 0] }).promise;
      box.replaceChildren(c); label.textContent = `Page ${page} / ${pdf.numPages}`; showText();
    } finally { busy = false; if (again) { again = false; draw(); } }
  }
  const turn = n => { page = Math.min(pdf.numPages, Math.max(1, page + n)); draw(); };
  const ask = (mode, whole, text) => go(`chat?subject=${d.subject_id}&doc=${id}&mode=${mode}${whole ? '&whole=1' : ''}&q=${encodeURIComponent(text)}`);
  api(`/api/documents/${encodeURIComponent(id)}/file`).then(async f => {
    passages = f.text; showText();
    if (f.data && /\.pdf$/i.test(f.name)) {
      const lib = await loadPdfJs();
      pdf = await lib.getDocument({ data: Uint8Array.from(atob(f.data), c => c.charCodeAt(0)), isEvalSupported: false }).promise;
      page = Math.min(page, pdf.numPages);
      tools.replaceChildren(btn('‹ Previous', () => turn(-1), 'sm alt'), label, btn('Next ›', () => turn(1), 'sm alt'), btn('−', () => { zoom = Math.max(.5, zoom - .25); draw(); }, 'sm alt'), btn('+', () => { zoom = Math.min(3, zoom + .25); draw(); }, 'sm alt'), btn('Full Screen', () => box.requestFullscreen?.(), 'sm alt'));
      await draw();
    } else throw new Error('preview');
  }).catch(() => {
    if (fileId) box.replaceChildren(h('iframe', { src: `https://drive.google.com/file/d/${fileId}/preview`, style: 'width:100%;height:70vh;border:0', allowfullscreen: true, title: d.pdf_name }));
    else { box.remove(); if (!passages.length) textBox.replaceChildren(empty('No preview available for this document.')); }
  });
  return [h('h2', { class: 'wrap' }, d.pdf_name), h('div', { class: 'muted' }, subjectName(d.subject_id) + (query.get('page') > 0 ? ` · Source page ${query.get('page')}` : '')),
    h('div', { class: 'row' }, btn('Ask AI About This PDF', () => go(`chat?subject=${d.subject_id}&doc=${id}`), 'sm'), btn('Summarize This PDF', () => ask('summary', true, `Summarize ${d.pdf_name}`), 'sm alt'),
      link && state.cache.prefs.allow_download ? h('a', { class: 'btn sm alt', href: fileId ? `https://drive.google.com/uc?export=download&id=${fileId}` : link, target: '_blank', rel: 'noopener noreferrer' }, 'Download') : null),
    tools, box,
    form('Ask', [q], async () => { if (!q.value.trim()) throw new Error('Type a question'); ask('answer', false, q.value.trim()); }, 'card'), textBox];
}

// ---------- book pages inside an answer (text, diagrams and tables exactly as printed) ----------
const pdfFiles = new Map();
function openPdf(id) {
  if (!pdfFiles.has(id)) {
    const job = (async () => {
      const f = await api(`/api/documents/${encodeURIComponent(id)}/file`);
      if (!f.data) throw new Error('The PDF file could not be read from Drive');
      if (!/\.pdf$/i.test(f.name)) throw new Error('Pages can be shown only for PDF files');
      const lib = await loadPdfJs();
      return lib.getDocument({ data: Uint8Array.from(atob(f.data), c => c.charCodeAt(0)), isEvalSupported: false }).promise;
    })();
    job.catch(() => pdfFiles.delete(id));
    pdfFiles.set(id, job);
    if (pdfFiles.size > 2) pdfFiles.delete(pdfFiles.keys().next().value);        // limit phone memory
  }
  return pdfFiles.get(id);
}
const squash = t => String(t || '').toLowerCase().replace(/[^a-z0-9ऀ-ॿ]/g, '');
async function headingTop(page, vp, heading) {          // distance from the page top, or null if not found
  const want = squash(heading); if (want.length < 3) return null;
  const lines = new Map();
  for (const it of (await page.getTextContent()).items) {
    const y = Math.round(it.transform[5]);
    const line = lines.get(y) || { text: '', x: it.transform[4], y, size: Math.abs(it.transform[3]) || 12 };
    line.text += it.str; lines.set(y, line);
  }
  const hit = [...lines.values()].find(l => squash(l.text) === want) || [...lines.values()].find(l => squash(l.text).startsWith(want));
  return hit ? Math.max(0, vp.convertToViewportPoint(hit.x, hit.y + hit.size * 1.5)[1]) : null;
}
async function drawBookPage(pdf, n, s, width, full) {
  const page = await pdf.getPage(n);
  const vp = page.getViewport({ scale: width / page.getViewport({ scale: 1 }).width });
  const ratio = Math.min(2, window.devicePixelRatio || 1);
  const whole = h('canvas', { width: Math.floor(vp.width * ratio), height: Math.floor(vp.height * ratio) });
  await page.render({ canvasContext: whole.getContext('2d'), viewport: vp, transform: [ratio, 0, 0, ratio, 0, 0] }).promise;
  let top = 0, bottom = vp.height;
  if (!full) {                                          // keep only this topic: from its heading to the next one
    if (n === s.page) top = await headingTop(page, vp, s.from) ?? 0;
    if (n === s.page_end && s.to) { const end = await headingTop(page, vp, s.to); if (end !== null && end > top) bottom = end; else if (end !== null && s.page !== s.page_end) bottom = end; }
  }
  if (bottom - top < 30) return null;
  const part = h('canvas', { class: 'book-page', width: whole.width, height: Math.max(1, Math.floor((bottom - top) * ratio)), 'aria-label': 'Book page ' + n });
  part.getContext('2d').drawImage(whole, 0, Math.floor(top * ratio), whole.width, part.height, 0, 0, part.width, part.height);
  return part;
}
function bookPages(s, auto) {
  const pages = h('div', { class: 'stack' }), note = h('div', { class: 'muted' }), more = h('div', { class: 'row' });
  const box = h('div', { class: 'book' }, h('b', {}, `📖 Book pages (${s.page}${s.page_end > s.page ? '–' + s.page_end : ''})`), pages, note, more);
  let next = s.page, full = false, busy = false;
  async function load() {
    if (busy) return; busy = true; more.replaceChildren(); note.textContent = 'Loading book pages…';
    try {
      const pdf = await openPdf(s.document_id), last = Math.min(Math.max(s.page_end, s.page), pdf.numPages);
      const width = Math.max(260, Math.min(820, pages.clientWidth || box.clientWidth || 320));
      for (let shown = 0; next <= last && shown < 8; next++, shown++) { const c = await drawBookPage(pdf, next, s, width, full); if (c) pages.append(c); }
      note.textContent = '';
      more.replaceChildren(...[next <= last ? btn(`Show next pages (${last - next + 1} left)`, load, 'sm') : null,
        btn(full ? 'Show only this topic' : 'Show full pages', () => { full = !full; next = s.page; pages.replaceChildren(); return load(); }, 'sm alt')].filter(Boolean));
    } catch (e) { note.textContent = e.message; more.replaceChildren(btn('Try again', load, 'sm alt')); }
    finally { busy = false; }
  }
  if (auto) setTimeout(load); else more.append(btn('Show book pages with diagrams', load, 'sm'));
  return box;
}
function addBookPages(el, sources, auto) {
  const s = sources?.find(x => x.page > 0 && x.page_end >= x.page);
  if (s) el.querySelector('.sig')?.before(bookPages(s, auto));
}

function conversations() {
  const map = new Map();

const focusTimer = { end: 0, minutes: 25, id: 0 };
function stopFocus() { clearInterval(focusTimer.id); focusTimer.end = 0; }
function startFocus(minutes) {
  stopFocus(); focusTimer.minutes = minutes; focusTimer.end = Date.now() + minutes * 60000;
  focusTimer.id = setInterval(async () => {
    if (Date.now() < focusTimer.end) return;
    stopFocus(); toast('Focus session complete 🎉');
    await safe(async () => { await need('items'); await saveItem('focus', newRef(), { minutes }); if (location.hash === '#/focus') render(); });
  }, 1000);
}

// Colour theme and text size, remembered on this device
const ACCENTS = { Purple: '#7C3AED', Blue: '#2563eb', Teal: '#0f766e', Pink: '#be185d', Orange: '#c2410c' };

// ================= animations =================
const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti() {
  if (still()) return;
  const box = h('div', { class: 'confetti', 'aria-hidden': 'true' }, [...Array(70)].map((_, i) => h('i', { style: `left:${Math.random() * 100}%;background:hsl(${i * 47 % 360} 85% 60%);animation-delay:${Math.random() * .5}s;animation-duration:${1.6 + Math.random()}s` })));
  document.body.append(box); setTimeout(() => box.remove(), 3200);
}
function countUp(el) {                          // numbers in stat cards roll up from zero
  const m = el.textContent.match(/^(\d+)(%?)$/); if (!m || +m[1] === 0) return;
  const end = +m[1], t0 = performance.now();
  const step = t => { const p = Math.min(1, (t - t0) / 800); el.textContent = Math.round(end * (1 - (1 - p) ** 3)) + m[2]; if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function typeIn(el) {                           // new AI answers appear as if being typed (text stays intact)
  if (still()) return;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
  while (walker.nextNode()) nodes.push([walker.currentNode, walker.currentNode.textContent]);
  const total = nodes.reduce((n, [, t]) => n + t.length, 0), t0 = performance.now(), time = Math.min(2200, total * 6);
  nodes.forEach(([n]) => n.textContent = '');
  const step = t => { let left = Math.ceil(total * Math.min(1, (t - t0) / time)); for (const [n, full] of nodes) { n.textContent = full.slice(0, Math.max(0, left)); left -= full.length; } if (t - t0 < time) requestAnimationFrame(step); else nodes.forEach(([n, full]) => n.textContent = full); };
  requestAnimationFrame(step);
}
const reveal = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('seen'); reveal.unobserve(e.target); } }), { threshold: .08 }) : null;
new MutationObserver(list => {                  // animate whatever gets added to the page
  for (const m of list) for (const n of m.addedNodes) {
    if (n.nodeType !== 1 || still()) continue;
    [n, ...n.querySelectorAll('.stat b, section.band')].forEach(x => { if (x.matches('.stat b')) countUp(x); else if (reveal && x.matches('section.band')) { x.classList.add('hide'); reveal.observe(x); } });
  }
}).observe($app, { childList: true, subtree: true });
document.addEventListener('pointerdown', e => {  // ripple on buttons
  const b = e.target.closest?.('.btn'); if (!b || b.disabled || still()) return;
  const r = b.getBoundingClientRect(), size = Math.max(r.width, r.height);
  const dot = h('span', { class: 'ripple', style: `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px` });
  b.append(dot); setTimeout(() => dot.remove(), 600);
});

const STUDENT = [['dashboard', '🏠', 'Dashboard'], ['subjects', '📘', 'My Subjects'], ['chat', '💬', 'AI Chat'], ['library', '📚', 'PDF Library'], ['tools', '🛠️', 'AI Study Tools'], ['quiz', '⏱️', 'Quiz & Tests'], ['bookmarks', '🔖', 'Bookmarks'], ['history', '🕘', 'Chat History'], ['assignments', '📝', 'Assignments'], ['leaderboard', '🏆', 'Leaderboard'], ['exams', '⏳', 'Exam Countdown'], ['timetable', '📅', 'Timetable'], ['planner', '🗓️', 'Study Planner'], ['focus', '🍅', 'Focus Timer'], ['notes', '✍️', 'My Notes'], ['progress', '📈', 'My Progress'], ['calculators', '🧮', 'Calculators'], ['search', '🔍', 'Search'], ['appearance', '🎨', 'Appearance'], ['profile', '👤', 'My Profile']];

const ADMIN_PAGES = { '': adminHome, courses: () => manageLevel('course'), semesters: () => manageLevel('semester'), subjects: () => manageLevel('subject'), pdfs: managePdfs, students, teachers, categories, analytics, settings };
const home = () => ({ admin: 'admin', teacher: 'teacher' })[state.user?.role] || 'dashboard';
function theme(next) { const t = next || store.get('sv_theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = t; if (next) store.set('sv_theme', next); }

let renderId = 0;
async function render() {
  const mine = ++renderId;
  cleanup.forEach(f => f()); cleanup = [];
  const [path, qs] = location.hash.replace(/^#\/?/, '').split('?');
  const [page = '', arg = ''] = path.split('/').map(decodeURIComponent);
  if (['', 'login', 'register', 'forgot'].includes(page)) {

  }
  if (!state.user) return go('login');

  const fn = page === 'admin' ? (admin ? ADMIN_PAGES[arg] : null) : PAGES[page];
  if (!fn || (page === 'dashboard' && state.user.role !== 'student') || (page === 'teacher' && state.user.role !== 'teacher')) return go(home());
  const menu = { admin: ADMIN, teacher: TEACHER }[state.user.role] || STUDENT;

  const side = h('aside', { class: 'side' }, logo(), menu.map(([p, i, l], n) => h('a', { style: `--i:${n}`, href: '#/' + p, class: p === path || (page !== 'admin' && p === page) ? 'on' : '', onclick: () => side.classList.remove('open') }, h('span', {}, i), l)), h('button', { class: 'nv', onclick: logout }, h('span', {}, '🚪'), 'Logout'));
