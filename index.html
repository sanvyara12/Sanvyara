<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanvyara AI</title>
<style>
  :root { --brand:#2563eb; --brand-d:#1d4ed8; --bg:#f8fafc; --card:#fff; --line:#e2e8f0;
          --text:#0f172a; --muted:#64748b; --err:#b91c1c; --ok:#047857; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  [hidden] { display:none !important; }
  header { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  .logo { font-weight:700; font-size:17px; }
  .who { font-size:13px; color:var(--muted); display:flex; gap:10px; align-items:center; }
  nav { display:flex; gap:6px; padding:10px 16px 0; max-width:720px; margin:0 auto; }
  nav button { flex:1; padding:9px; border:1px solid var(--line); background:var(--card); border-radius:10px; font:inherit; font-weight:600; color:var(--muted); cursor:pointer; }
  nav button.on { background:var(--brand); border-color:var(--brand); color:#fff; }
  main { max-width:720px; margin:0 auto; padding:12px 16px 32px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; display:grid; gap:10px; }
  .card h3 { margin:0; font-size:15px; }
  select, input { width:100%; padding:10px; font:inherit; border:1px solid #cbd5e1; border-radius:8px; background:#fff; color:var(--text); }
  select:disabled { background:#f1f5f9; color:#94a3b8; }
  input:focus, select:focus { outline:2px solid var(--brand); border-color:transparent; }
  .btn { padding:10px 16px; border:0; border-radius:8px; background:var(--brand); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  .btn:hover { background:var(--brand-d); }
  .btn:disabled { opacity:.6; cursor:default; }
  .link { background:none; border:0; padding:0; color:var(--brand); font:inherit; cursor:pointer; }
  .muted { color:var(--muted); font-size:13px; }
  .msg { padding:9px 12px; border-radius:8px; font-size:14px; }
  .msg.err { background:#fef2f2; color:var(--err); }
  .msg.warn { background:#fffbeb; color:#92400e; }
  .auth { max-width:380px; margin:8vh auto 0; padding:0 16px; }
  .auth h1 { text-align:center; margin:0 0 4px; font-size:26px; }
  .auth p.sub { text-align:center; margin:0 0 18px; color:var(--muted); }
  .thread { display:grid; gap:10px; margin:4px 0 12px; }
  .bubble { padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; max-width:92%; }
  .bubble.me { background:var(--brand); color:#fff; justify-self:end; }
  .bubble.ai { background:#e8eef7; justify-self:start; }
  .src { margin-top:8px; padding-top:8px; border-top:1px solid #cbd5e1; font-size:12px; color:#475569; }
  .ask { display:flex; gap:8px; position:sticky; bottom:0; padding:10px 0; background:var(--bg); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .row .name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row a { color:var(--brand); text-decoration:none; font-weight:600; font-size:14px; }
  .row .x { background:none; border:0; color:var(--err); cursor:pointer; font-size:16px; }
  details > summary { cursor:pointer; font-weight:600; }
  details[open] > summary { margin-bottom:10px; }
  ul.tree { margin:0; padding-left:18px; font-size:14px; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#0f172a; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; z-index:9; max-width:90vw; }
  #toast.err { background:var(--err); }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden></div>

<script>
// ---------- tiny helpers ----------
// h('div', {class:'x', onclick:fn}, child1, child2)  -> DOM element. Strings become text (safe from XSS).
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  el.append(...kids.flat().filter(k => k != null && k !== false));
  return el;
}

const $app = document.getElementById('app');
const $toast = document.getElementById('toast');
let toastTimer;
function toast(text, isErr) {
  $toast.textContent = text;
  $toast.className = isErr ? 'err' : '';
  $toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.hidden = true, 3200);
}

function load(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } }
const state = { token: load('sv_token'), user: load('sv_user'), tree: [], docs: [], tab: 'ask', demo: false };

function logout() {
  localStorage.removeItem('sv_token'); localStorage.removeItem('sv_user');
  state.token = state.user = null; state.tree = []; state.tab = 'ask';
  render();
}

async function api(path, method = 'GET', body) {
  const res = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json', ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch {}
  if (res.status === 401 && state.token) { logout(); throw new Error('Session expired. Please log in again.'); }
  if (!res.ok) throw new Error(typeof data?.detail === 'string' ? data.detail : 'Please fill in all fields');
  return data;
}

// Run an action, show an error toast if it fails
async function safe(fn) { try { return await fn(); } catch (e) { toast(e.message, true); } }

// **bold** support for AI answers (everything else stays plain text)
function rich(text) {
  return text.split(/\*\*(.+?)\*\*/g).map((part, i) => i % 2 ? h('strong', {}, part) : part);
}

// ---------- Course > Semester > Subject dropdowns ----------
// levels: 1 = course only, 2 = + semester, 3 = + subject
function picker(levels, onChange) {
  const names = ['Course', 'Semester', 'Subject'];
  const idKey = ['course_id', 'semester_id', 'subject_id'];
  const label = [c => c.course_name, s => s.semester_name, s => (s.subject_code ? s.subject_code + ' - ' : '') + s.subject_name];
  const sel = names.slice(0, levels).map(() => h('select'));

  function options(i) {
    let list = state.tree;
    if (i >= 1) list = (list.find(c => c.course_id === sel[0].value) || {}).semesters || [];
    if (i >= 2) list = (list.find(s => s.semester_id === sel[1].value) || {}).subjects || [];
    return list;
  }
  function fill(i) {
    sel[i].replaceChildren(
      h('option', { value: '' }, names[i]),
      ...options(i).map(x => h('option', { value: x[idKey[i]] }, label[i](x)))
    );
    sel[i].disabled = i > 0 && !sel[i - 1].value;
  }
  sel.forEach((s, i) => {
    s.addEventListener('change', () => {
      for (let j = i + 1; j < levels; j++) fill(j);
      if (onChange) onChange(get());
    });
    fill(i);
  });
  const get = () => ({ course_id: sel[0].value, semester_id: sel[1]?.value || '', subject_id: sel[2]?.value || '' });
  return { el: h('div', { style: 'display:grid;gap:8px' }, sel), get };
}

// subject ids that match the current dropdown selection
function subjectIdsFor(v) {
  const ids = [];
  for (const c of state.tree) {
    if (v.course_id && c.course_id !== v.course_id) continue;
    for (const s of c.semesters) {
      if (v.semester_id && s.semester_id !== v.semester_id) continue;
      for (const sub of s.subjects) if (!v.subject_id || sub.subject_id === v.subject_id) ids.push(sub.subject_id);
    }
  }
  return ids;
}
function subjectName(id) {
  for (const c of state.tree) for (const s of c.semesters) for (const sub of s.subjects) if (sub.subject_id === id) return sub.subject_name;
  return '';
}

// ---------- Login / Register ----------
function authView() {
  let mode = 'login';
  const name = h('input', { placeholder: 'Full name', autocomplete: 'name' });
  const email = h('input', { type: 'email', placeholder: 'Email', required: true, autocomplete: 'email' });
  const pass = h('input', { type: 'password', placeholder: 'Password', required: true, minlength: 6 });
  const err = h('div', { class: 'msg err', hidden: true });
  const btn = h('button', { class: 'btn', type: 'submit' }, 'Login');
  const switchBtn = h('button', { class: 'link', type: 'button' });

  function paint() {
    const login = mode === 'login';
    name.hidden = login;
    btn.textContent = login ? 'Login' : 'Create account';
    switchBtn.textContent = login ? 'New here? Register' : 'Have an account? Login';
    err.hidden = true;
  }
  switchBtn.onclick = () => { mode = mode === 'login' ? 'register' : 'login'; paint(); };

  const form = h('form', {
    class: 'card',
    onsubmit: async e => {
      e.preventDefault();
      err.hidden = true; btn.disabled = true;
      try {
        const body = mode === 'login' ? { email: email.value, password: pass.value }
                                      : { name: name.value, email: email.value, password: pass.value };
        const r = await api(mode === 'login' ? '/api/login' : '/api/register', 'POST', body);
        state.token = r.token; state.user = r.user;
        localStorage.setItem('sv_token', JSON.stringify(r.token));
        localStorage.setItem('sv_user', JSON.stringify(r.user));
        await boot();
      } catch (ex) { err.textContent = ex.message; err.hidden = false; }
      finally { btn.disabled = false; }
    },
  }, name, email, pass, err, btn, h('div', { class: 'muted', style: 'text-align:center' }, switchBtn));
  paint();

  $app.replaceChildren(h('div', { class: 'auth' },
    h('h1', {}, '🧠 Sanvyara AI'),
    h('p', { class: 'sub' }, 'Ask questions from your college notes'),
    form,
    state.demo ? h('p', { class: 'muted', style: 'text-align:center' },
      'Demo mode — Admin: admin@sanvyara.ai / admin123', h('br'), 'Student: rahul@example.com / student123') : null
  ));
}

// ---------- Ask AI ----------
const MODES = [['answer', 'Answer'], ['summary', 'Summary'], ['notes', 'Short notes'], ['exam', 'Exam answer (5 marks)'], ['mcq', 'MCQs']];

function askView(main) {
  const pick = picker(3);
  const mode = h('select', {}, MODES.map(([v, l]) => h('option', { value: v }, l)));
  const thread = h('div', { class: 'thread' });
  const hint = h('p', { class: 'muted', style: 'text-align:center' }, 'Pick a subject, then ask anything from your notes.');
  const input = h('input', { placeholder: 'Ask a question…', maxlength: 1000, required: true, autocomplete: 'off' });
  const send = h('button', { class: 'btn', type: 'submit' }, 'Send');

  function bubble(role, text, sources) {
    hint.remove();
    const b = h('div', { class: 'bubble ' + role }, rich(text));
    if (sources && sources.length) {
      b.append(h('div', { class: 'src' }, sources.map(s => h('div', {}, `📄 ${s.pdf_name} · Page ${s.page}`))));
    }
    thread.append(b);
    b.scrollIntoView({ block: 'nearest' });
    return b;
  }

  const form = h('form', {
    class: 'ask',
    onsubmit: async e => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      input.value = ''; send.disabled = true;
      bubble('me', q);
      const wait = bubble('ai', 'Thinking…');
      try {
        const r = await api('/api/ask', 'POST', { question: q, subject_id: pick.get().subject_id || null, mode: mode.value });
        wait.remove(); bubble('ai', r.answer, r.sources);
      } catch (ex) { wait.remove(); bubble('ai', 'Sorry: ' + ex.message); }
      finally { send.disabled = false; input.focus(); }
    },
  }, input, send);

  main.append(h('div', { class: 'card' }, pick.el, mode), hint, thread, form);

  // show earlier chats (stored in the Google Sheet)
  api('/api/history').then(rows => {
    rows.reverse().forEach(r => { bubble('me', r.question); bubble('ai', r.answer, r.sources); });
  }).catch(() => {});
}

// ---------- Library (Drive links) ----------
async function libraryView(main) {
  const list = h('div');
  const pick = picker(3, draw);

  function draw() {
    const ids = subjectIdsFor(pick.get());
    const docs = state.docs.filter(d => ids.includes(d.subject_id));
    list.replaceChildren(...(docs.length ? docs.map(d => {
      const canDelete = state.user.role === 'admin' || d.uploaded_by === state.user.user_id;
      const safeLink = /^https?:\/\//.test(d.drive_link);
      return h('div', { class: 'card' }, h('div', { class: 'row' },
        h('div', { style: 'min-width:0' },
          h('div', { class: 'name' }, d.pdf_name),
          h('div', { class: 'muted' }, `${subjectName(d.subject_id)} · ${d.document_type}`)),
        h('div', { class: 'row' },
          safeLink ? h('a', { href: d.drive_link, target: '_blank', rel: 'noopener noreferrer' }, 'Open') : null,
          canDelete ? h('button', { class: 'x', title: 'Delete', onclick: () => remove(d.document_id) }, '🗑') : null)));
    }) : [h('p', { class: 'muted', style: 'text-align:center' }, 'No documents here yet.')]));
  }

  async function reload() {
    await safe(async () => { state.docs = await api('/api/documents'); });
    draw();
  }
  async function remove(id) {
    if (!confirm('Delete this document?')) return;
    await safe(async () => { await api('/api/documents/' + id, 'DELETE'); toast('Deleted'); });
    reload();
  }

  // add-document form
  const addPick = picker(3);
  const name = h('input', { placeholder: 'Document name', required: true });
  const link = h('input', { type: 'url', placeholder: 'Google Drive link (https://…)', required: true });
  const type = h('select', {}, ['Notes', 'Book', 'PPT', 'PYQ'].map(t => h('option', {}, t)));
  const addForm = h('form', {
    class: 'card',
    onsubmit: async e => {
      e.preventDefault();
      const subject_id = addPick.get().subject_id;
      if (!subject_id) return toast('Select course, semester and subject', true);
      const ok = await safe(async () => {
        await api('/api/documents', 'POST', { subject_id, pdf_name: name.value, drive_link: link.value, document_type: type.value });
        return true;
      });
      if (ok) { toast('Document added'); name.value = link.value = ''; reload(); }
    },
  }, h('details', {}, h('summary', {}, '＋ Add a document link'),
       h('div', { style: 'display:grid;gap:10px' }, addPick.el, name, link, type, h('button', { class: 'btn', type: 'submit' }, 'Add'))));

  main.append(h('div', { class: 'card' }, pick.el), list, addForm);
  await reload();
}

// ---------- Admin ----------
function adminView(main) {
  async function create(path, body, okText) {
    const ok = await safe(async () => { await api(path, 'POST', body); return true; });
    if (ok) { toast(okText); await safe(loadTree); render(); }
  }

  const courseName = h('input', { placeholder: 'Course name (e.g. BCA)', required: true });
  const courseForm = h('form', { class: 'card', onsubmit: e => { e.preventDefault(); create('/api/admin/course', { course_name: courseName.value }, 'Course added'); } },
    h('h3', {}, 'Add course'), courseName, h('button', { class: 'btn', type: 'submit' }, 'Add course'));

  const semPick = picker(1);
  const semName = h('input', { placeholder: 'Semester name (e.g. Semester 4)', required: true });
  const semForm = h('form', { class: 'card', onsubmit: e => {
      e.preventDefault();
      const course_id = semPick.get().course_id;
      if (!course_id) return toast('Select a course', true);
      create('/api/admin/semester', { course_id, semester_name: semName.value }, 'Semester added');
    } }, h('h3', {}, 'Add semester'), semPick.el, semName, h('button', { class: 'btn', type: 'submit' }, 'Add semester'));

  const subPick = picker(2);
  const subCode = h('input', { placeholder: 'Subject code (e.g. BCA-401)' });
  const subName = h('input', { placeholder: 'Subject name (e.g. DBMS)', required: true });
  const subForm = h('form', { class: 'card', onsubmit: e => {
      e.preventDefault();
      const semester_id = subPick.get().semester_id;
      if (!semester_id) return toast('Select course and semester', true);
      create('/api/admin/subject', { semester_id, subject_code: subCode.value, subject_name: subName.value }, 'Subject added');
    } }, h('h3', {}, 'Add subject'), subPick.el, subCode, subName, h('button', { class: 'btn', type: 'submit' }, 'Add subject'));

  const overview = h('div', { class: 'card' }, h('h3', {}, 'Current structure'),
    state.tree.length ? h('ul', { class: 'tree' }, state.tree.map(c =>
      h('li', {}, c.course_name, h('ul', {}, c.semesters.map(s =>
        h('li', {}, `${s.semester_name} — `, s.subjects.map(x => x.subject_name).join(', ') || 'no subjects')))))) :
      h('p', { class: 'muted' }, 'Nothing yet. Add a course to start.'));

  main.append(
    state.demo ? h('div', { class: 'msg warn', style: 'margin-bottom:12px' }, '⚠ Google Sheet is not connected — data is temporary and resets when the server restarts.') : null,
    courseForm, semForm, subForm, overview);
}

// ---------- App shell ----------
function shell() {
  if (state.tab === 'admin' && state.user.role !== 'admin') state.tab = 'ask';
  const tabs = [['ask', 'Ask AI'], ['library', 'Library']];
  if (state.user.role === 'admin') tabs.push(['admin', 'Admin']);

  const main = h('main');
  $app.replaceChildren(
    h('header', {}, h('div', { class: 'logo' }, '🧠 Sanvyara AI'),
      h('div', { class: 'who' }, state.user.name, h('button', { class: 'link', onclick: logout }, 'Logout'))),
    h('nav', {}, tabs.map(([id, label]) =>
      h('button', { class: state.tab === id ? 'on' : '', onclick: () => { state.tab = id; render(); } }, label))),
    main);
  ({ ask: askView, library: libraryView, admin: adminView })[state.tab](main);
}

function render() { state.user ? shell() : authView(); }

async function loadTree() { state.tree = await api('/api/tree'); }

async function boot() {
  await safe(async () => { state.tree = await api('/api/tree'); });
  render();
}

(async function init() {
  try { const info = await fetch('/api/info').then(r => r.json()); state.demo = info.demo; } catch {}
  if (state.token) {
    try { state.user = await api('/api/me'); localStorage.setItem('sv_user', JSON.stringify(state.user)); await boot(); return; }
    catch { /* token invalid -> logged out by api() */ }
  }
  render();
})();
</script>
</body>
</html>
